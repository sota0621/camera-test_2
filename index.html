<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>撮影ナビゲーションシステム</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/opencv.js/4.5.5/opencv.js" id="opencv-src"></script>
</head>
<body>

    <div id="setup-screen" class="panel">
        <h2>撮影ナビゲーションシステム</h2>
        <p id="loading-text">システムを準備中（OpenCV読み込み中）...</p>
        <div id="setup-buttons" style="display: none;">
            <button id="make-smartphone-btn" class="btn mode-btn">📱 スマホ（カメラ配信側）として起動</button>
            <button id="make-pc-btn" class="btn mode-btn">💻 パソコン（ナビ・確認側）として起動</button>
        </div>
    </div>

    <div id="smartphone-screen" class="panel" style="display: none;">
        <h2>📱 カメラ配信中</h2>
        <div id="room-code-display">接続コード: <span id="my-id-text">---</span></div>
        <p class="guide-msg">このコードをパソコン側に入力してください</p>
        <video id="smartphone-video" autoplay playsinline muted></video>
        <div id="phone-status">映像送信待ち...</div>
    </div>

    <div id="pc-screen" class="panel" style="display: none;">
        <h2>💻 撮影ナビゲーション</h2>
        <div id="connect-form">
            <input type="text" id="peer-id-input" placeholder="スマホに表示されたコードを入力">
            <button id="connect-btn" class="btn">接続してスキャン開始</button>
        </div>
        <div id="status-alert" class="alert-searching">スマホの接続を待っています</div>
        <div class="canvas-container">
            <video id="received-video" autoplay playsinline muted style="display:none;"></video>
            <canvas id="analysis-canvas"></canvas>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
